<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OLVISIÓN — Pedidos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#034291">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OLVISIÓN">
  <link rel="apple-touch-icon" href="logo.png">
</head>
<body>

  <!-- ░░ HEADER ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░ -->
  <header id="app-header">
    <div class="header-brand">
      <img src="logo-white.png" class="header-logo" alt="OLVISIÓN">
    </div>
    <div class="header-user">
      <div id="user-avatar" class="avatar-small"></div>
      <span id="user-name" class="header-username"></span>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </header>

  <!-- ░░ MAIN ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░ -->
  <main id="main-content">

    <!-- ── PANEL (admin) ───────────────────────────────────────── -->
    <section id="section-panel" class="section hidden">
      <div class="section-top">
        <h1 class="section-title">Panel</h1>
        <div class="panel-mes-nav">
          <button class="btn-mes" onclick="panelMesAnterior()">‹</button>
          <span id="panel-mes-label" class="mes-label"></span>
          <button class="btn-mes" onclick="panelMesSiguiente()">›</button>
        </div>
      </div>
      <div id="panel-content"></div>
    </section>

    <!-- ── PEDIDOS ─────────────────────────────────────────────── -->
    <section id="section-pedidos" class="section hidden">
      <div class="section-top">
        <h1 class="section-title">Pedidos</h1>
      </div>
      <div class="search-bar-wrapper">
        <input type="search" id="search-pedidos"
               placeholder="Buscar cliente u orden..."
               oninput="filtrarPedidos(this.value)"
               autocomplete="off">
      </div>
      <div id="pedidos-tabs" class="estado-tabs"></div>
      <div id="pedidos-list" class="pedidos-container"></div>
    </section>

    <!-- ── NUEVO PEDIDO ────────────────────────────────────────── -->
    <section id="section-nuevo" class="section hidden">
      <div class="section-top">
        <h1 class="section-title">Nuevo pedido</h1>
      </div>

      <form id="form-nuevo-pedido" onsubmit="submitNuevoPedido(event)" autocomplete="off" novalidate>

        <!-- CLIENTE -->
        <div class="card-form">
          <div class="card-form-title">Cliente</div>

          <div class="form-group">
            <label class="form-label">Buscar cliente existente</label>
            <div class="cliente-search-wrapper">
              <input type="text" id="cliente-search-input"
                     placeholder="Nombre, apellido o teléfono..."
                     oninput="onClienteSearchInput(this.value)"
                     autocomplete="off">
              <div id="cliente-suggestions" class="suggestions-dropdown hidden"></div>
            </div>
            <div id="cliente-seleccionado" class="cliente-chip hidden">
              <span id="cliente-chip-nombre"></span>
              <button type="button" class="chip-clear" onclick="limpiarClienteSeleccionado()">✕</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Nombre del cliente *</label>
            <input type="text" id="campo-cliente" required
                   placeholder="O escribí el nombre directamente">
            <input type="hidden" id="campo-cliente-id">
          </div>

          <div class="form-group">
            <label class="form-label">Número de orden *</label>
            <input type="text" id="campo-orden" required
                   placeholder="Ej: 12345" inputmode="numeric">
          </div>

          <div class="form-group toggle-row">
            <label class="form-label">Urgente</label>
            <label class="switch">
              <input type="checkbox" id="campo-urgente">
              <span class="slider slider-urgente"></span>
            </label>
          </div>

          <div class="form-group toggle-row">
            <label class="form-label">2 anteojos</label>
            <label class="switch">
              <input type="checkbox" id="toggle-dos-anteojos" onchange="toggleDosAnteojos()">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- ANTEOJO A -->
        <div class="card-form" id="bloque-a">
          <div class="card-form-title" id="label-anteojo-a">Anteojo</div>

          <div class="form-group">
            <label class="form-label">Tipo de pedido *</label>
            <select id="campo-tipo-a" required>
              <option value="">Seleccionar...</option>
              <option value="Cristales">Cristales</option>
              <option value="Armazón + Cristales">Armazón + Cristales</option>
              <option value="Armazón">Armazón</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Laboratorio *</label>
            <select id="campo-laboratorio-a" required>
              <option value="">Seleccionar...</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Tipo de lente *</label>
            <select id="campo-tipo-lente-a" required>
              <option value="">Seleccionar...</option>
              <option value="Monofocal">Monofocal</option>
              <option value="Bifocal">Bifocal</option>
              <option value="Ocupacional">Ocupacional</option>
              <option value="Progresivo">Progresivo</option>
              <option value="Teñido">Teñido</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Tratamiento</label>
            <select id="campo-tratamiento-a">
              <option value="">Sin tratamiento</option>
            </select>
          </div>

          <!-- GRADUACIÓN A -->
          <div class="form-group">
            <label class="form-label">Graduación</label>
            <div class="grad-table">
              <div class="grad-header-row">
                <span></span><span>Esf</span><span>Cil</span><span>Eje</span><span>Add</span>
              </div>
              <div class="grad-data-row">
                <span class="grad-ojo-label">OD</span>
                <input class="grad-input" id="a-od-esf" readonly onclick="abrirNumpad(this)" data-bloque="a" data-ojo="od" data-campo="esf" placeholder="±0.00">
                <input class="grad-input" id="a-od-cil" readonly onclick="abrirNumpad(this)" data-bloque="a" data-ojo="od" data-campo="cil" placeholder="±0.00">
                <input class="grad-input" id="a-od-eje" inputmode="numeric" data-bloque="a" data-ojo="od" data-campo="eje" placeholder="0°" oninput="formatEje(this)">
                <input class="grad-input" id="a-od-add" readonly onclick="abrirNumpad(this)" data-bloque="a" data-ojo="od" data-campo="add" placeholder="+0.00">
              </div>
              <div class="grad-data-row">
                <span class="grad-ojo-label">OI</span>
                <input class="grad-input" id="a-oi-esf" readonly onclick="abrirNumpad(this)" data-bloque="a" data-ojo="oi" data-campo="esf" placeholder="±0.00">
                <input class="grad-input" id="a-oi-cil" readonly onclick="abrirNumpad(this)" data-bloque="a" data-ojo="oi" data-campo="cil" placeholder="±0.00">
                <input class="grad-input" id="a-oi-eje" inputmode="numeric" data-bloque="a" data-ojo="oi" data-campo="eje" placeholder="0°" oninput="formatEje(this)">
                <input class="grad-input" id="a-oi-add" readonly onclick="abrirNumpad(this)" data-bloque="a" data-ojo="oi" data-campo="add" placeholder="+0.00">
              </div>
            </div>
          </div>

          <div class="form-group toggle-row">
            <label class="form-label">Trabajo en 2 etapas</label>
            <label class="switch">
              <input type="checkbox" id="campo-dos-etapas-a">
              <span class="slider"></span>
            </label>
          </div>

          <!-- ARMAZÓN A -->
          <div class="form-group">
            <label class="form-label">Armazón</label>
            <div class="segmented-control">
              <button type="button" class="seg-btn active" id="btn-arm-nuevo-a" onclick="setArmazonTipo('nuevo','a')">Nuevo</button>
              <button type="button" class="seg-btn" id="btn-arm-cliente-a" onclick="setArmazonTipo('cliente','a')">Del cliente</button>
            </div>
          </div>

          <div id="armazon-nuevo-a">
            <div class="form-group">
              <label class="form-label">Marca</label>
              <select id="campo-marca-a"><option value="">Sin marca</option></select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Código/Ref</label>
                <input type="text" id="campo-codigo-a" placeholder="Ref...">
              </div>
              <div class="form-group">
                <label class="form-label">Material</label>
                <select id="campo-material-a"><option value="">-</option></select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Color</label>
              <input type="text" id="campo-color-a" placeholder="Color...">
            </div>
          </div>

          <div id="armazon-cliente-a" class="hidden">
            <div class="form-group">
              <label class="form-label">Marca</label>
              <input type="text" id="campo-marca-libre-a" placeholder="Marca del cliente...">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Material</label>
                <select id="campo-material-libre-a"><option value="">-</option></select>
              </div>
              <div class="form-group">
                <label class="form-label">Color</label>
                <input type="text" id="campo-color-libre-a" placeholder="Color...">
              </div>
            </div>
          </div>
        </div><!-- /bloque-a -->

        <!-- ANTEOJO B -->
        <div class="card-form hidden" id="bloque-b">
          <div class="card-form-title">Anteojo B</div>

          <div class="form-group">
            <label class="form-label">Laboratorio *</label>
            <select id="campo-laboratorio-b">
              <option value="">Seleccionar...</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Tipo de lente *</label>
            <select id="campo-tipo-lente-b">
              <option value="">Seleccionar...</option>
              <option value="Monofocal">Monofocal</option>
              <option value="Bifocal">Bifocal</option>
              <option value="Ocupacional">Ocupacional</option>
              <option value="Progresivo">Progresivo</option>
              <option value="Teñido">Teñido</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Tratamiento</label>
            <select id="campo-tratamiento-b">
              <option value="">Sin tratamiento</option>
            </select>
          </div>

          <!-- GRADUACIÓN B -->
          <div class="form-group">
            <label class="form-label">Graduación</label>
            <div class="grad-table">
              <div class="grad-header-row">
                <span></span><span>Esf</span><span>Cil</span><span>Eje</span><span>Add</span>
              </div>
              <div class="grad-data-row">
                <span class="grad-ojo-label">OD</span>
                <input class="grad-input" id="b-od-esf" readonly onclick="abrirNumpad(this)" data-bloque="b" data-ojo="od" data-campo="esf" placeholder="±0.00">
                <input class="grad-input" id="b-od-cil" readonly onclick="abrirNumpad(this)" data-bloque="b" data-ojo="od" data-campo="cil" placeholder="±0.00">
                <input class="grad-input" id="b-od-eje" inputmode="numeric" data-bloque="b" data-ojo="od" data-campo="eje" placeholder="0°" oninput="formatEje(this)">
                <input class="grad-input" id="b-od-add" readonly onclick="abrirNumpad(this)" data-bloque="b" data-ojo="od" data-campo="add" placeholder="+0.00">
              </div>
              <div class="grad-data-row">
                <span class="grad-ojo-label">OI</span>
                <input class="grad-input" id="b-oi-esf" readonly onclick="abrirNumpad(this)" data-bloque="b" data-ojo="oi" data-campo="esf" placeholder="±0.00">
                <input class="grad-input" id="b-oi-cil" readonly onclick="abrirNumpad(this)" data-bloque="b" data-ojo="oi" data-campo="cil" placeholder="±0.00">
                <input class="grad-input" id="b-oi-eje" inputmode="numeric" data-bloque="b" data-ojo="oi" data-campo="eje" placeholder="0°" oninput="formatEje(this)">
                <input class="grad-input" id="b-oi-add" readonly onclick="abrirNumpad(this)" data-bloque="b" data-ojo="oi" data-campo="add" placeholder="+0.00">
              </div>
            </div>
          </div>

          <div class="form-group toggle-row">
            <label class="form-label">Trabajo en 2 etapas</label>
            <label class="switch">
              <input type="checkbox" id="campo-dos-etapas-b">
              <span class="slider"></span>
            </label>
          </div>

          <div class="form-group">
            <label class="form-label">Armazón</label>
            <div class="segmented-control">
              <button type="button" class="seg-btn active" id="btn-arm-nuevo-b" onclick="setArmazonTipo('nuevo','b')">Nuevo</button>
              <button type="button" class="seg-btn" id="btn-arm-cliente-b" onclick="setArmazonTipo('cliente','b')">Del cliente</button>
            </div>
          </div>

          <div id="armazon-nuevo-b">
            <div class="form-group">
              <label class="form-label">Marca</label>
              <select id="campo-marca-b"><option value="">Sin marca</option></select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Código/Ref</label>
                <input type="text" id="campo-codigo-b" placeholder="Ref...">
              </div>
              <div class="form-group">
                <label class="form-label">Material</label>
                <select id="campo-material-b"><option value="">-</option></select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Color</label>
              <input type="text" id="campo-color-b" placeholder="Color...">
            </div>
          </div>

          <div id="armazon-cliente-b" class="hidden">
            <div class="form-group">
              <label class="form-label">Marca</label>
              <input type="text" id="campo-marca-libre-b" placeholder="Marca del cliente...">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Material</label>
                <select id="campo-material-libre-b"><option value="">-</option></select>
              </div>
              <div class="form-group">
                <label class="form-label">Color</label>
                <input type="text" id="campo-color-libre-b" placeholder="Color...">
              </div>
            </div>
          </div>
        </div><!-- /bloque-b -->

        <div class="form-submit-area">
          <button type="submit" class="btn-primary btn-full btn-large" id="btn-guardar-pedido">
            Guardar pedido
          </button>
        </div>

      </form>
    </section>

    <!-- ── HISTORIAL ───────────────────────────────────────────── -->
    <section id="section-historial" class="section hidden">
      <div class="section-top">
        <h1 class="section-title">Historial</h1>
        <div class="historial-nav">
          <button class="btn-mes" onclick="historialMesAnterior()">‹</button>
          <span id="historial-mes-label" class="mes-label"></span>
          <button class="btn-mes" onclick="historialMesSiguiente()">›</button>
        </div>
      </div>
      <div id="historial-list" class="pedidos-container"></div>
    </section>

    <!-- ── AGENDA ──────────────────────────────────────────────── -->
    <section id="section-agenda" class="section hidden">
      <div class="section-top">
        <h1 class="section-title">Agenda</h1>
      </div>
      <div class="search-bar-wrapper">
        <input type="search" id="agenda-search"
               placeholder="Nombre, apellido, teléfono, médico..."
               oninput="filtrarAgenda(this.value)"
               autocomplete="off">
      </div>
      <div id="agenda-list" class="agenda-container">
        <div class="loading-state"><div class="spinner"></div>Cargando...</div>
      </div>
      <button class="fab" onclick="abrirFormCliente()">+</button>
    </section>

    <!-- ── CONFIG (admin) ─────────────────────────────────────── -->
    <section id="section-config" class="section hidden">
      <div class="section-top">
        <h1 class="section-title">Configuración</h1>
      </div>
      <div id="config-content"></div>
    </section>

  </main>

  <!-- ░░ BOTTOM NAV ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░ -->
  <nav id="bottom-nav">

    <button class="nav-btn admin-only hidden" id="nav-panel" onclick="showSection('panel')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>Panel</span>
    </button>

    <button class="nav-btn" id="nav-pedidos" onclick="showSection('pedidos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6"  x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6"  x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span>Pedidos</span>
      <span id="badge-criticos" class="nav-badge hidden"></span>
    </button>

    <button class="nav-btn nav-btn-nuevo" id="nav-nuevo" onclick="showSection('nuevo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span>Nuevo</span>
    </button>

    <button class="nav-btn" id="nav-agenda" onclick="showSection('agenda')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Agenda</span>
    </button>

    <button class="nav-btn" id="nav-historial" onclick="showSection('historial')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="12 8 12 12 14 14"/>
        <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/>
      </svg>
      <span>Historial</span>
    </button>

    <button class="nav-btn admin-only hidden" id="nav-config" onclick="showSection('config')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Config</span>
    </button>

  </nav>

  <!-- ░░ SHEETS & MODALES ░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░ -->

  <!-- Detalle pedido -->
  <div id="pedido-overlay" class="overlay hidden" onclick="cerrarPedidoSheet()"></div>
  <div id="pedido-sheet" class="bottom-sheet hidden">
    <div class="sheet-drag-handle"></div>
    <div id="pedido-sheet-content" class="sheet-body"></div>
  </div>

  <!-- Ficha cliente -->
  <div id="cliente-sheet-overlay" class="overlay hidden" onclick="cerrarFichaCliente()"></div>
  <div id="cliente-sheet" class="bottom-sheet hidden">
    <div class="sheet-drag-handle"></div>
    <div id="cliente-sheet-content" class="sheet-body"></div>
  </div>

  <!-- Form nuevo/editar cliente -->
  <div id="cliente-form-overlay" class="overlay hidden" onclick="cerrarFormCliente()"></div>
  <div id="cliente-form-sheet" class="bottom-sheet hidden">
    <div class="sheet-drag-handle"></div>
    <div id="cliente-form-content" class="sheet-body"></div>
  </div>

  <!-- Confirmar acción -->
  <div id="confirm-overlay" class="modal-overlay hidden">
    <div id="confirm-modal" class="modal-box">
      <div id="confirm-title" class="modal-title"></div>
      <div id="confirm-body"  class="modal-body"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="cerrarConfirm()">Cancelar</button>
        <button class="btn-danger"    id="confirm-ok">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Numpad graduación -->
  <div id="numpad-overlay" class="overlay hidden" onclick="cerrarNumpad()"></div>
  <div id="numpad-sheet" class="bottom-sheet numpad-sheet hidden">
    <div class="sheet-drag-handle"></div>
    <div id="numpad-content"></div>
