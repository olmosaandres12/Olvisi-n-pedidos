<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OLVISIÓN — Iniciar sesión</title>
  <meta name="description" content="Sistema de gestión de pedidos de laboratorio — OLVISIÓN">

  <!-- ── PWA / Ícono de app en iPhone ── -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OLVISIÓN">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#034291">

  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Splash screen ── */
    #splash-screen {
      position: fixed; inset: 0;
      background: #ffffff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #splash-screen.fade-out {
      opacity: 0; transform: scale(1.03); pointer-events: none;
    }
    .splash-logo {
      width: 220px; max-width: 65vw;
      animation: splashIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .splash-tagline {
      margin-top: 16px; font-size: 0.82rem;
      color: #999; font-family: -apple-system, sans-serif;
      letter-spacing: 0.4px;
      animation: splashIn 0.5s ease 0.2s both;
    }
    .splash-spinner {
      margin-top: 40px; width: 26px; height: 26px;
      border: 2.5px solid #EBF2FF;
      border-top-color: #034291;
      border-radius: 50%;
      animation: spin 0.8s linear infinite, splashIn 0.4s ease 0.3s both;
    }
    @keyframes splashIn {
      from { opacity:0; transform:scale(0.88) translateY(12px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Login: fondo blanco ── */
    .login-page {
      min-height: 100dvh;
      background: #F5F6FA;          /* gris claro en vez de azul */
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }

    /* Logo azul en el login */
    .login-logo {
      margin-bottom: 28px; text-align: center;
    }
    .login-logo-img {
      width: 180px; max-width: 60vw;
      display: block; margin: 0 auto;
    }
    .login-logo-fallback {
      display: none;
    }
    .login-logo-fallback h1 {
      font-size: 2rem; font-weight: 800;
      color: var(--azul); letter-spacing: -1px;
    }
    .login-logo-fallback p {
      font-size: .85rem; color: var(--gris-texto); margin-top: 4px;
    }

    /* Card de login sobre fondo claro */
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(3,66,145,0.10);
      border: 1px solid #DDE3EE;
    }
    .login-card h2 {
      font-size: 1.1rem; font-weight: 600;
      color: var(--gris-dark); margin-bottom: 20px;
    }

    .login-error-box {
      background: var(--rojo-bg);
      border: 1px solid var(--rojo-borde);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: .875rem; color: var(--rojo);
      margin-bottom: 16px; display: none;
    }
    .login-error-box.visible { display: block; }

    .login-footer {
      text-align: center; margin-top: 20px;
      font-size: .78rem; color: #aaa;
    }
    .eye-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--gris-texto); cursor: pointer; padding: 4px;
    }
    .pass-wrap { position: relative; }
  </style>
</head>
<body>

<!-- ── Splash screen (fondo blanco, logo original) ── -->
<div id="splash-screen">
  <img
    src="logo.png"
    alt="OLVISIÓN"
    class="splash-logo"
    onerror="this.style.display='none';document.getElementById('splash-text').style.display='block'"
  >
  <div id="splash-text" style="display:none;font-size:2.2rem;font-weight:800;color:#034291;letter-spacing:-1px">OLVISIÓN</div>
  <div class="splash-tagline">Gestión de pedidos de laboratorio</div>
  <div class="splash-spinner"></div>
</div>

<!-- ── Login (fondo blanco, logo azul) ── -->
<main class="login-page" id="login-main" style="display:none">

  <div class="login-logo">
    <!-- Logo azul sobre fondo blanco — el logo.png ya es azul sobre blanco -->
    <img
      src="logo.png"
      alt="OLVISIÓN"
      class="login-logo-img"
      onerror="this.style.display='none';document.getElementById('login-logo-fb').style.display='block'"
    >
    <div id="login-logo-fb" class="login-logo-fallback">
      <h1>OLVISIÓN</h1>
      <p>Gestión de pedidos de laboratorio</p>
    </div>
  </div>

  <div class="login-card">
    <h2>Iniciar sesión</h2>

    <div id="login-error" class="login-error-box" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label required">Correo electrónico</label>
        <input type="email" id="email" name="email"
          class="form-control" placeholder="nombre@olvision.com"
          autocomplete="email" inputmode="email" required>
        <div class="form-error" id="email-error">Ingresá un correo válido</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label required">Contraseña</label>
        <div class="pass-wrap">
          <input type="password" id="password" name="password"
            class="form-control" placeholder="••••••••"
            autocomplete="current-password" required>
          <button type="button" class="eye-btn" id="toggle-pass" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" id="eye-open"/>
              <circle cx="12" cy="12" r="3" id="eye-circle"/>
              <line x1="1" y1="1" x2="23" y2="23" id="eye-slash" style="display:none"/>
            </svg>
          </button>
        </div>
        <div class="form-error" id="pass-error">Ingresá tu contraseña</div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="btn-login">
        Entrar
      </button>
    </form>
  </div>

  <p class="login-footer">OLVISIÓN © 2025 — Sistema interno</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
<script src="auth.js"></script>

<script>
(async () => {
  const splash   = document.getElementById('splash-screen');
  const loginEl  = document.getElementById('login-main');

  const splashMin   = new Promise(r => setTimeout(r, 1400));
  const sessionCheck = window.supabaseClient.auth.getSession();
  const [, { data: { session } }] = await Promise.all([splashMin, sessionCheck]);

  splash.classList.add('fade-out');
  setTimeout(() => splash.remove(), 500);

  if (session) { window.location.href = 'app.html'; return; }

  loginEl.style.display = '';
  loginEl.style.opacity = '0';
  loginEl.style.transform = 'translateY(14px)';
  requestAnimationFrame(() => {
    loginEl.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    loginEl.style.opacity = '1';
    loginEl.style.transform = 'translateY(0)';
  });

  const form    = document.getElementById('login-form');
  const btnLog  = document.getElementById('btn-login');
  const errBox  = document.getElementById('login-error');
  const togPass = document.getElementById('toggle-pass');
  const passIn  = document.getElementById('password');
  const eyeSlash = document.getElementById('eye-slash');
  const eyeOpen  = document.getElementById('eye-open');
  const eyeCirc  = document.getElementById('eye-circle');

  togPass.addEventListener('click', () => {
    const isText = passIn.type === 'text';
    passIn.type = isText ? 'password' : 'text';
    eyeSlash.style.display = isText ? 'none'   : 'inline';
    eyeOpen.style.display  = isText ? 'inline' : 'none';
    eyeCirc.style.display  = isText ? 'inline' : 'none';
  });

  const showError = msg => { errBox.textContent = msg; errBox.classList.add('visible'); };
  const hideError = ()  => errBox.classList.remove('visible');

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); hideError();
    const email = document.getElementById('email').value.trim();
    const pass  = passIn.value;
    let valid = true;
    if (!email || !email.includes('@')) {
      document.getElementById('email-error').classList.add('visible');
      document.getElementById('email').classList.add('error'); valid = false;
    } else {
      document.getElementById('email-error').classList.remove('visible');
      document.getElementById('email').classList.remove('error');
    }
    if (!pass) {
      document.getElementById('pass-error').classList.add('visible');
      document.getElementById('password').classList.add('error'); valid = false;
    } else {
      document.getElementById('pass-error').classList.remove('visible');
      document.getElementById('password').classList.remove('error');
    }
    if (!valid) return;

    btnLog.classList.add('btn-loading'); btnLog.disabled = true;
    try {
      await Auth.login(email, pass);
      window.location.href = 'app.html';
    } catch (err) {
      const msg = err.message?.includes('Invalid login') || err.message?.includes('credentials')
        ? 'Correo o contraseña incorrectos.'
        : `Error: ${err.message}`;
      showError(msg);
    } finally {
      btnLog.classList.remove('btn-loading'); btnLog.disabled = false;
    }
  });

  ['email','password'].forEach(id => document.getElementById(id).addEventListener('input', hideError));
})();
</script>
</body>
</html>
