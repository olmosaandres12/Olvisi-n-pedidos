<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OLVISIÓN — Iniciar sesión</title>
  <meta name="description" content="Sistema de gestión de pedidos de laboratorio — OLVISIÓN">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos extra del login */
    .login-error-box {
      background: var(--rojo-bg);
      border: 1px solid var(--rojo-borde);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: .875rem;
      color: var(--rojo);
      margin-bottom: 16px;
      display: none;
    }
    .login-error-box.visible { display: block; }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: .78rem;
      color: rgba(255,255,255,.4);
    }
    .eye-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--gris-texto); cursor: pointer; padding: 4px;
    }
    .pass-wrap { position: relative; }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-logo">OL<span>VISIÓN</span></div>
  <div class="spinner-ring"></div>
</div>

<main class="login-page">
  <div class="login-logo">
    <div class="login-logo-mark">
      <!-- Ícono de lente / ojo -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="20" cy="20" rx="18" ry="11" stroke="#034291" stroke-width="2.5"/>
        <circle cx="20" cy="20" r="6" fill="#034291"/>
        <circle cx="22" cy="18" r="2" fill="#F9F4AB"/>
      </svg>
    </div>
    <h1>OLVISIÓN</h1>
    <p>Gestión de pedidos de laboratorio</p>
  </div>

  <div class="login-card">
    <h2>Iniciar sesión</h2>

    <div id="login-error" class="login-error-box" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label required">Correo electrónico</label>
        <input
          type="email" id="email" name="email"
          class="form-control" placeholder="nombre@olvision.com"
          autocomplete="email" inputmode="email"
          required
        >
        <div class="form-error" id="email-error">Ingresá un correo válido</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label required">Contraseña</label>
        <div class="pass-wrap">
          <input
            type="password" id="password" name="password"
            class="form-control" placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <button type="button" class="eye-btn" id="toggle-pass" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" id="eye-open"/>
              <circle cx="12" cy="12" r="3" id="eye-circle"/>
              <line x1="1" y1="1" x2="23" y2="23" id="eye-slash" style="display:none"/>
            </svg>
          </button>
        </div>
        <div class="form-error" id="pass-error">Ingresá tu contraseña</div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="btn-login">
        Entrar
      </button>
    </form>
  </div>

  <p class="login-footer">OLVISIÓN © 2025 — Sistema interno</p>
</main>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  // Inicializar cliente Supabase
  window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script src="auth.js"></script>

<script>
(async () => {
  // Ocultar loading
  const overlay = document.getElementById('loading-overlay');
  
  // Si ya hay sesión activa → redirigir
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  overlay.classList.add('fade-out');
  setTimeout(() => overlay.remove(), 400);

  if (session) {
    window.location.href = 'app.html';
    return;
  }

  // ── Form logic ─────────────────────────────────
  const form    = document.getElementById('login-form');
  const btnLog  = document.getElementById('btn-login');
  const errBox  = document.getElementById('login-error');
  const togPass = document.getElementById('toggle-pass');
  const passIn  = document.getElementById('password');
  const eyeSlash = document.getElementById('eye-slash');
  const eyeOpen  = document.getElementById('eye-open');
  const eyeCirc  = document.getElementById('eye-circle');

  // Toggle password visibility
  togPass.addEventListener('click', () => {
    const isText = passIn.type === 'text';
    passIn.type  = isText ? 'password' : 'text';
    eyeSlash.style.display = isText ? 'none'   : 'inline';
    eyeOpen.style.display  = isText ? 'inline' : 'none';
    eyeCirc.style.display  = isText ? 'inline' : 'none';
  });

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('visible');
  }
  function hideError() {
    errBox.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const pass  = passIn.value;

    // Validación básica
    let valid = true;
    if (!email || !email.includes('@')) {
      document.getElementById('email-error').classList.add('visible');
      document.getElementById('email').classList.add('error');
      valid = false;
    } else {
      document.getElementById('email-error').classList.remove('visible');
      document.getElementById('email').classList.remove('error');
    }
    if (!pass) {
      document.getElementById('pass-error').classList.add('visible');
      document.getElementById('password').classList.add('error');
      valid = false;
    } else {
      document.getElementById('pass-error').classList.remove('visible');
      document.getElementById('password').classList.remove('error');
    }
    if (!valid) return;

    btnLog.classList.add('btn-loading');
    btnLog.disabled = true;

    try {
      await Auth.login(email, pass);
      window.location.href = 'app.html';
    } catch (err) {
      const msg = err.message?.includes('Invalid login') || err.message?.includes('credentials')
        ? 'Correo o contraseña incorrectos.'
        : `Error: ${err.message}`;
      showError(msg);
    } finally {
      btnLog.classList.remove('btn-loading');
      btnLog.disabled = false;
    }
  });

  // Limpiar errores al tipear
  ['email', 'password'].forEach(id => {
    document.getElementById(id).addEventListener('input', hideError);
  });
})();
</script>

</body>
</html>
