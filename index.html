<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OLVISIÓN</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OLVISIÓN">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#034291">
  <link rel="stylesheet" href="style.css">
  <style>

    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    /* ── Splash ── */
    #splash-screen {
      position: fixed; inset: 0; background: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #splash-screen.fade-out { opacity: 0; transform: scale(1.03); pointer-events: none; }
    .splash-logo { width: 220px; max-width: 65vw; animation: splashIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
    .splash-tagline { margin-top: 14px; font-size: 0.82rem; color: #999; animation: splashIn 0.5s ease 0.2s both; }
    .splash-spinner {
      margin-top: 40px; width: 26px; height: 26px;
      border: 2.5px solid #EBF2FF; border-top-color: #034291;
      border-radius: 50%;
      animation: spin 0.8s linear infinite, splashIn 0.4s ease 0.3s both;
    }
    @keyframes splashIn { from { opacity:0; transform:scale(0.88) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Login page ── */
    .login-page {
      min-height: 100dvh;
      background: var(--azul);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 20px;
      overflow: hidden;
    }

    .login-logo-wrap { margin-bottom: 48px; text-align: center; }
    .login-logo-wrap img { width: 190px; max-width: 60vw; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.15)); }
    .logo-fallback { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -1px; display: none; }

    /* ── Selector de usuarios ── */
    .user-selector { width: 100%; max-width: 340px; }
    .user-selector-title {
      font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.45);
      text-align: center; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
    }
    .user-list { display: flex; flex-direction: column; gap: 10px; }
    .user-btn {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.10);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 13px 16px;
      cursor: pointer; width: 100%;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .user-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.20); }

    .user-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; flex-shrink: 0;
    }
    .avatar-andres    { background: #F9F4AB; color: #034291; }
    .avatar-sandra    { background: linear-gradient(135deg, #7B1FA2, #4527A0); color: #fff; }
    .avatar-valentina { background: linear-gradient(135deg, #00897B, #00695C); color: #fff; }

    .user-info { flex: 1; text-align: left; }
    .user-name { font-size: 16px; font-weight: 700; color: #fff; }
    .user-role { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 1px; }
    .user-arrow { color: rgba(255,255,255,0.35); font-size: 20px; line-height: 1; }

    /* ── PIN Panel ── */
    .pin-panel {
      width: 100%; max-width: 340px;
      display: none; flex-direction: column; align-items: center;
    }
    .pin-panel.visible { display: flex; animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .pin-user-label {
      font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.8);
      margin-bottom: 28px; text-align: center;
    }
    .pin-user-label span { color: #fff; font-weight: 800; }

    /* Puntos */
    .pin-dots { display: flex; gap: 18px; margin-bottom: 36px; }
    .pin-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      background: transparent;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .pin-dot.filled { background: #fff; border-color: #fff; transform: scale(1.15); }
    .pin-dot.error  { border-color: #ff6b6b; background: #ff6b6b; }

    /* Teclado — círculos perfectos con aspect-ratio */
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(4, 72px);
      gap: 14px;
      justify-content: center;
    }
    .pin-key {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.13);
      border: none; color: #fff;
      font-size: 26px; font-weight: 400;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, transform 0.1s;
      font-family: -apple-system, 'SF Pro Display', sans-serif;
      letter-spacing: 0;
      user-select: none;
    }
    .pin-key:active { background: rgba(255,255,255,0.30); transform: scale(0.92); }
    .pin-key.empty  { background: transparent; pointer-events: none; visibility: hidden; }
    .pin-key.delete { font-size: 22px; background: rgba(255,255,255,0.08); }
    .pin-key.delete:active { background: rgba(255,255,255,0.22); }

    .pin-error-msg {
      font-size: 13px; color: #ff8a80; font-weight: 600;
      margin-top: 20px; text-align: center; min-height: 20px;
    }
    .pin-error-msg.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); }
      80%{ transform:translateX(5px); }
    }

    .pin-back-btn {
      margin-top: 24px; background: none; border: none;
      color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 500;
      cursor: pointer; padding: 8px 20px;
    }
    .pin-back-btn:active { color: rgba(255,255,255,0.8); }

    .login-footer {
      position: fixed; bottom: max(16px, env(safe-area-inset-bottom));
      left: 0; right: 0;
      text-align: center; font-size: 11px; color: rgba(255,255,255,0.2);
    }

  </style>
</head>
<body>

<!-- Splash -->
<div id="splash-screen">
  <img src="logo.png" alt="OLVISIÓN" class="splash-logo"
    onerror="this.style.display='none';document.getElementById('splash-text').style.display='block'">
  <div id="splash-text" style="display:none;font-size:2rem;font-weight:800;color:#034291">OLVISIÓN</div>
  <div class="splash-tagline">Gestión de pedidos de laboratorio</div>
  <div class="splash-spinner"></div>
</div>

<!-- Login -->
<main class="login-page" id="login-main" style="display:none">

  <div class="login-logo-wrap">
    <img src="logo-white.png" alt="OLVISIÓN"
      onerror="this.style.display='none';document.querySelector('.logo-fallback').style.display='block'">
    <div class="logo-fallback">OLVISIÓN</div>
  </div>

  <!-- Paso 1: elegir usuario -->
  <div class="user-selector" id="step-users">
    <div class="user-selector-title">¿Quién sos?</div>
    <div class="user-list">
      <button class="user-btn" onclick="selectUser('andres')">
        <div class="user-avatar avatar-andres">A</div>
        <div class="user-info">
          <div class="user-name">Andrés</div>
          <div class="user-role">Administrador</div>
        </div>
        <div class="user-arrow">›</div>
      </button>
      <button class="user-btn" onclick="selectUser('sandra')">
        <div class="user-avatar avatar-sandra">S</div>
        <div class="user-info">
          <div class="user-name">Sandra</div>
          <div class="user-role">Operadora</div>
        </div>
        <div class="user-arrow">›</div>
      </button>
      <button class="user-btn" onclick="selectUser('valentina')">
        <div class="user-avatar avatar-valentina">V</div>
        <div class="user-info">
          <div class="user-name">Valentina</div>
          <div class="user-role">Operadora</div>
        </div>
        <div class="user-arrow">›</div>
      </button>
    </div>
  </div>

  <!-- Paso 2: PIN -->
  <div class="pin-panel" id="step-pin">
    <div class="pin-user-label">Hola, <span id="pin-username">Andrés</span> 👋</div>

    <div class="pin-dots">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>

    <div class="pin-keypad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key delete" onclick="pinDelete()">⌫</button>
    </div>

    <div class="pin-error-msg" id="pin-error"></div>
    <button class="pin-back-btn" onclick="goBack()">← Cambiar usuario</button>
  </div>

  <p class="login-footer">OLVISIÓN © 2025 — Sistema interno</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
<script src="auth.js"></script>

<script>
  const USERS = {
    andres:    { email: 'olmosaandres12@gmail.com', nombre: 'Andrés' },
    sandra:    { email: 'sandra@olvision.com',      nombre: 'Sandra' },
    valentina: { email: 'valentina@olvision.com',   nombre: 'Valentina' },
  };

  let _selectedUser = null;
  let _pin = '';
  let _submitting = false;

  function selectUser(key) {
    _selectedUser = key;
    _pin = '';
    updateDots();
    document.getElementById('pin-username').textContent = USERS[key].nombre;
    document.getElementById('pin-error').textContent = '';
    document.getElementById('pin-error').classList.remove('shake');
    document.getElementById('step-users').style.display = 'none';
    document.getElementById('step-pin').classList.add('visible');
  }

  function goBack() {
    _selectedUser = null; _pin = '';
    updateDots();
    document.getElementById('pin-error').textContent = '';
    document.getElementById('step-users').style.display = 'block';
    document.getElementById('step-pin').classList.remove('visible');
  }

  function pinPress(digit) {
    if (_submitting || _pin.length >= 4) return;
    _pin += digit;
    updateDots();
    if (_pin.length === 4) setTimeout(submitPin, 150);
  }

  function pinDelete() {
    if (_submitting || _pin.length === 0) return;
    _pin = _pin.slice(0, -1);
    updateDots();
    document.getElementById('pin-error').textContent = '';
  }

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(`dot-${i}`);
      dot.classList.toggle('filled', i < _pin.length);
      dot.classList.remove('error');
    }
  }

  function showPinError(msg) {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(`dot-${i}`);
      dot.classList.add('error'); dot.classList.remove('filled');
    }
    const errEl = document.getElementById('pin-error');
    errEl.textContent = msg;
    errEl.classList.remove('shake');
    void errEl.offsetWidth; // reflow para reiniciar animación
    errEl.classList.add('shake');
    _pin = '';
    setTimeout(updateDots, 600);
  }

  async function submitPin() {
    if (!_selectedUser || _submitting) return;
    _submitting = true;
    try {
      await Auth.login(USERS[_selectedUser].email, _pin);
      window.location.href = 'app.html';
    } catch {
      showPinError('PIN incorrecto, intentá de nuevo');
      _submitting = false;
    }
  }

  document.addEventListener('keydown', (e) => {
    if (!_selectedUser) return;
    if (e.key >= '0' && e.key <= '9') pinPress(e.key);
    if (e.key === 'Backspace') pinDelete();
  });

  (async () => {
    const splash    = document.getElementById('splash-screen');
    const loginEl   = document.getElementById('login-main');
    const splashMin = new Promise(r => setTimeout(r, 1400));
    const [, { data: { session } }] = await Promise.all([splashMin, window.supabaseClient.auth.getSession()]);
    splash.classList.add('fade-out');
    setTimeout(() => splash.remove(), 500);
    if (session) { window.location.href = 'app.html'; return; }
    loginEl.style.display = '';
    loginEl.style.opacity = '0';
    loginEl.style.transform = 'translateY(14px)';
    requestAnimationFrame(() => {
      loginEl.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      loginEl.style.opacity = '1';
      loginEl.style.transform = 'translateY(0)';
    });
  })();
</script>
</body>
</html>
