<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OLVISIÓN — Iniciar sesión</title>
  <meta name="description" content="Sistema de gestión de pedidos de laboratorio — OLVISIÓN">

  <!-- ── PWA / Ícono de app en iPhone ──────────────────── -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OLVISIÓN">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
  <link rel="apple-touch-icon" sizes="152x152" href="logo.png">
  <link rel="apple-touch-icon" sizes="120x120" href="logo.png">

  <!-- Splash screens iPhone -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-startup-image" href="logo.png">

  <!-- Ícono estándar -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" href="logo.png">

  <!-- Manifest para Android / Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#034291">

  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Splash screen ─────────────────────────────── */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }
    .splash-logo {
      width: 200px;
      max-width: 60vw;
      animation: splash-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .splash-tagline {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #888;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      letter-spacing: 0.5px;
      animation: splash-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
    }
    .splash-spinner {
      margin-top: 40px;
      width: 28px;
      height: 28px;
      border: 3px solid #EBF2FF;
      border-top-color: #034291;
      border-radius: 50%;
      animation: spin 0.8s linear infinite, splash-in 0.4s ease 0.3s both;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Estilos del login ─────────────────────────── */
    .login-error-box {
      background: var(--rojo-bg);
      border: 1px solid var(--rojo-borde);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: .875rem;
      color: var(--rojo);
      margin-bottom: 16px;
      display: none;
    }
    .login-error-box.visible { display: block; }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: .78rem;
      color: rgba(255,255,255,.4);
    }
    .eye-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--gris-texto); cursor: pointer; padding: 4px;
    }
    .pass-wrap { position: relative; }

    /* Reemplazo del logo de texto por imagen en login */
    .login-logo-img {
      width: 160px;
      max-width: 55vw;
      display: block;
      margin: 0 auto 8px;
    }
    .login-logo-img-hidden { display: none; }
    .login-logo-mark { display: none; }

    /* Si no carga la imagen, mostramos texto */
    .login-logo-text-fallback h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .login-logo-text-fallback p {
      font-size: .85rem;
      opacity: .75;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<!-- ── Splash screen ─────────────────────────────────── -->
<div id="splash-screen">
  <img
    src="logo.png"
    alt="OLVISIÓN"
    class="splash-logo"
    onerror="this.style.display='none';document.getElementById('splash-fallback').style.display='flex'"
  >
  <div id="splash-fallback" style="display:none;flex-direction:column;align-items:center">
    <div style="font-size:2.5rem;font-weight:800;color:#034291;letter-spacing:-1px">
      OL<span style="color:#034291">VISIÓN</span>
    </div>
  </div>
  <div class="splash-tagline">Gestión de pedidos de laboratorio</div>
  <div class="splash-spinner"></div>
</div>

<!-- ── Loading overlay (mientras verifica sesión) ─────── -->
<div id="loading-overlay" style="display:none">
  <div class="loading-logo">OL<span>VISIÓN</span></div>
  <div class="spinner-ring"></div>
</div>

<main class="login-page" style="display:none" id="login-main">
  <div class="login-logo">
    <!-- Logo imagen -->
    <img
      src="logo.png"
      alt="OLVISIÓN"
      class="login-logo-img"
      id="login-logo-img"
      onerror="this.style.display='none';document.getElementById('login-logo-fallback').style.display='block'"
    >
    <!-- Fallback texto si no carga la imagen -->
    <div id="login-logo-fallback" class="login-logo-text-fallback" style="display:none">
      <h1>OLVISIÓN</h1>
      <p>Gestión de pedidos de laboratorio</p>
    </div>
    <p style="font-size:.8rem;opacity:.7;margin-top:6px">Gestión de pedidos</p>
  </div>

  <div class="login-card">
    <h2>Iniciar sesión</h2>

    <div id="login-error" class="login-error-box" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label required">Correo electrónico</label>
        <input
          type="email" id="email" name="email"
          class="form-control" placeholder="nombre@olvision.com"
          autocomplete="email" inputmode="email"
          required
        >
        <div class="form-error" id="email-error">Ingresá un correo válido</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label required">Contraseña</label>
        <div class="pass-wrap">
          <input
            type="password" id="password" name="password"
            class="form-control" placeholder="••••••••"
            autocomplete="current-password"
            required
          >
          <button type="button" class="eye-btn" id="toggle-pass" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" id="eye-open"/>
              <circle cx="12" cy="12" r="3" id="eye-circle"/>
              <line x1="1" y1="1" x2="23" y2="23" id="eye-slash" style="display:none"/>
            </svg>
          </button>
        </div>
        <div class="form-error" id="pass-error">Ingresá tu contraseña</div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="btn-login">
        Entrar
      </button>
    </form>
  </div>

  <p class="login-footer">OLVISIÓN © 2025 — Sistema interno</p>
</main>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script src="auth.js"></script>

<script>
(async () => {
  const splash  = document.getElementById('splash-screen');
  const loginEl = document.getElementById('login-main');

  // Mostrar splash mínimo 1.2 segundos para que se aprecie el logo
  const splashMin = new Promise(r => setTimeout(r, 1200));

  // Verificar sesión en paralelo
  const sessionCheck = window.supabaseClient.auth.getSession();

  // Esperar ambas
  const [, { data: { session } }] = await Promise.all([splashMin, sessionCheck]);

  // Ocultar splash
  splash.classList.add('fade-out');
  setTimeout(() => splash.remove(), 500);

  if (session) {
    window.location.href = 'app.html';
    return;
  }

  // Mostrar login con animación suave
  loginEl.style.display = '';
  loginEl.style.opacity = '0';
  loginEl.style.transform = 'translateY(12px)';
  requestAnimationFrame(() => {
    loginEl.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    loginEl.style.opacity = '1';
    loginEl.style.transform = 'translateY(0)';
  });

  // ── Form logic ─────────────────────────────────
  const form    = document.getElementById('login-form');
  const btnLog  = document.getElementById('btn-login');
  const errBox  = document.getElementById('login-error');
  const togPass = document.getElementById('toggle-pass');
  const passIn  = document.getElementById('password');
  const eyeSlash = document.getElementById('eye-slash');
  const eyeOpen  = document.getElementById('eye-open');
  const eyeCirc  = document.getElementById('eye-circle');

  togPass.addEventListener('click', () => {
    const isText = passIn.type === 'text';
    passIn.type  = isText ? 'password' : 'text';
    eyeSlash.style.display = isText ? 'none'   : 'inline';
    eyeOpen.style.display  = isText ? 'inline' : 'none';
    eyeCirc.style.display  = isText ? 'inline' : 'none';
  });

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('visible');
  }
  function hideError() {
    errBox.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email = document.getElementById('email').value.trim();
    const pass  = passIn.value;

    let valid = true;
    if (!email || !email.includes('@')) {
      document.getElementById('email-error').classList.add('visible');
      document.getElementById('email').classList.add('error');
      valid = false;
    } else {
      document.getElementById('email-error').classList.remove('visible');
      document.getElementById('email').classList.remove('error');
    }
    if (!pass) {
      document.getElementById('pass-error').classList.add('visible');
      document.getElementById('password').classList.add('error');
      valid = false;
    } else {
      document.getElementById('pass-error').classList.remove('visible');
      document.getElementById('password').classList.remove('error');
    }
    if (!valid) return;

    btnLog.classList.add('btn-loading');
    btnLog.disabled = true;

    try {
      await Auth.login(email, pass);
      window.location.href = 'app.html';
    } catch (err) {
      const msg = err.message?.includes('Invalid login') || err.message?.includes('credentials')
        ? 'Correo o contraseña incorrectos.'
        : `Error: ${err.message}`;
      showError(msg);
    } finally {
      btnLog.classList.remove('btn-loading');
      btnLog.disabled = false;
    }
  });

  ['email', 'password'].forEach(id => {
    document.getElementById(id).addEventListener('input', hideError);
  });
})();
</script>

</body>
</html>
